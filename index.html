<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusItinera — Sito in manutenzione</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BusItinera è temporaneamente in manutenzione. Torniamo online a breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--soft:#f5f8fc;--card:#ffffff;
  --ink:#0f1b2d;--ink2:#3b4a5e;--muted:#6b7a90;
  --line:#e6ecf3;--line2:#d6deea;
  --primary:#2563eb;--primary-soft:#eaf1ff;
  --accent:#f97316;--accent-soft:#fff3ea;
  --green:#059669;
  --shadow:0 1px 2px rgba(16,27,45,.04),0 8px 24px rgba(16,27,45,.06);
  --shadow-lg:0 24px 60px rgba(16,27,45,.12);
  --font:'Outfit',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink2);-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(37,99,235,.08),transparent 70%),linear-gradient(180deg,var(--soft),var(--bg) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.logo-badge{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#1a2b45,#0f1b2d);box-shadow:0 24px 56px rgba(16,27,45,.28);display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.logo-badge img{width:60%;height:auto;display:block}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 16px;border-radius:100px;margin-bottom:22px;color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--ink);margin-bottom:16px}
h1 .or{color:var(--accent)}
.sub{font-size:1.1rem;color:var(--muted);line-height:1.7;max-width:560px;margin:0 auto 34px}
.bar{width:100%;max-width:360px;height:5px;background:#e6ecf3;border-radius:5px;overflow:hidden;margin:0 auto 36px;position:relative}
.bar::before{content:'';position:absolute;top:0;left:0;height:100%;width:35%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--accent));animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:100px;padding:13px 24px;font-size:.95rem;font-weight:600;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .3s}
.link:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow-lg)}
.link.mail{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 10px 26px rgba(37,99,235,.28)}
.foot{margin-top:48px;font-size:.82rem;color:var(--muted)}
.foot strong{color:var(--ink2)}
@media(max-width:600px){.links{flex-direction:column;align-items:stretch}.link{justify-content:center}}
</style>
</head>
<body>
  <div class="logo-badge"><img src="logo.png" alt="BusItinera"></div>
  <span class="chip"><span class="dot"></span>Manutenzione in corso</span>
  <h1>Sito in <span class="or">manutenzione</span></h1>
  <p class="sub">Stiamo lavorando per migliorare <strong style="color:var(--ink)">BusItinera</strong>. Torniamo online a breve con nuove funzionalità e miglioramenti. Nel frattempo puoi contattarmi direttamente.</p>
  <div class="bar"></div>
  <div class="links">
    <a href="mailto:ceolandrea006@gmail.com" class="link mail">✉️ ceolandrea006@gmail.com</a>
    <a href="tel:+393274997730" class="link">📞 +39 327 499 7730</a>
  </div>
  <div class="foot">© 2026 BusItinera Autotrasporti — <strong>Andrea Ceol</strong></div>
</body>
</html>
